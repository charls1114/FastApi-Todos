# 스키마 변경 시: alembic revision -m "설명" 후 backend/migrations/versions 의 파일을 작성
# 앱은 시작할 때 init_db() 에서 자동으로 alembic upgrade head 를 실행한다.
[alembic]
script_location = %(here)s/backend/migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
