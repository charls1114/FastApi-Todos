name: CI

# Build & Test 단계: 사람·에이전트가 만든 모든 PR에 같은 검증을 적용한다.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (SQLite + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: todos_test
          POSTGRES_USER: todos
          POSTGRES_PASSWORD: todos-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U todos -d todos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: fastapi-app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: fastapi-app/requirements.txt
      - run: pip install -r requirements.txt
      - name: pytest (SQLite)
        run: python -m pytest tests/test_main.py tests/test_database.py --cov=backend --cov-report=xml
      - name: pytest (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://todos:todos-test-only@localhost:5432/todos_test
        run: python -m pytest tests/test_main.py tests/test_database.py

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: fastapi-app/frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fastapi-app/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
