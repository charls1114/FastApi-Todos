services:
  fastapi-app:
    build:
      context: ./fastapi-app      # Dockerfile이 위치한 디렉토리 경로
      dockerfile: Dockerfile      # Dockerfile 이름 (생략 가능, 기본값은 'Dockerfile')
    container_name: FastApi-app
    ports:
      - "5001:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-todos}
      POSTGRES_USER: ${POSTGRES_USER:-todos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped       # 서버 재부팅·오류 시 자동 재시작
    security_opt:
      - no-new-privileges:true    # 컨테이너 안에서 권한 상승 차단
    cap_drop:
      - ALL                       # 불필요한 커널 권한 모두 제거
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-todos}
      POSTGRES_USER: ${POSTGRES_USER:-todos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  sonarqube:
    image: sonarqube:26.9.0.129388-community
    container_name: sonarqube
    read_only: true                             # 컨테이너 파일시스템 읽기 전용 (아래 볼륨과 /tmp만 쓰기 가능)
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:                                    # ← 추가: 볼륨을 컨테이너 경로에 마운트
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_temp:/opt/sonarqube/temp
    tmpfs:                                      # ← 추가: /tmp를 쓰기 가능하게
      - /tmp
  prometheus:
    image: prom/prometheus:v3.15.0              # latest 대신 버전 고정
    container_name: prometheus
    read_only: true                             # 컨테이너 파일시스템 읽기 전용 (데이터 볼륨만 쓰기 가능)
    security_opt:
      - no-new-privileges:true                  # 컨테이너 안에서 권한 상승 차단
    cap_drop:
      - ALL                                     # 불필요한 커널 권한 모두 제거
    ports:
      - "127.0.0.1:7070:9090"                   # 서버 자신에게만 공개 (Prometheus는 로그인 기능이 없음)
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro   # 설정 파일은 읽기 전용(:ro)
      - prometheus-data:/prometheus             # 수집한 메트릭 저장 (컨테이너를 다시 만들어도 유지)
  grafana:
    image: grafana/grafana:13.2.4               # latest 대신 버전 고정 (2026-10-13 보안 패치 버전)
    container_name: grafana
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_BASIC_PASSWORD_POLICY=true      # 비밀번호 12자 이상 + 대·소문자·숫자·특수문자 필수
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_PLUGINS_PREINSTALL_AUTO_UPDATE=false
    volumes:
      - grafana-data:/var/lib/grafana
    node-exporter:
      image: prom/node-exporter:v1.12.1           # latest 대신 버전 고정
      container_name: node-exporter
      read_only: true
      security_opt:
        - no-new-privileges:true
      cap_drop:
        - ALL
volumes:                                        # ← 최상위(0칸)로 이동
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_temp:
  postgres-data:
  prometheus-data:
  grafana-data:
